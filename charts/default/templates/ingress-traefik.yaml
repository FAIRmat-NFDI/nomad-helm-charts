{{/*
Traefik counterparts of the nginx ingress annotations the chart relied on.
Only rendered when the target controller is traefik and the Traefik CRDs
(traefik.io/v1alpha1) are available (nomad.ingress.traefik.crds.enabled).

  limit-connections       -> InFlightReq Middleware (per client IP)
  limit-connections (api) -> InFlightReq Middleware attached to the /api ingress
  limit-rps               -> RateLimit Middleware (per client IP, 5x burst)
  ssl-redirect            -> RedirectScheme Middleware
  proxy-connect-timeout   -> ServersTransport forwardingTimeouts.dialTimeout
  proxy-read-timeout      -> ServersTransport forwardingTimeouts.responseHeaderTimeout

proxy-request-buffering=off and proxy-body-size need no counterpart: Traefik
streams request bodies and imposes no body size limit by default.

The ServersTransport is attached to the proxy Service (see proxy/service.yaml),
since Traefik binds transports per backend service rather than per router.
*/}}
{{- if include "nomad.ingress.traefikCRs" . -}}
{{- /*
Upgrade guard: a release that used to run on ingress-nginx without an explicit
className now resolves to traefik. Fail early with a hint instead of letting the
apiserver reject the Middleware CRs (or, worse, silently dropping the nginx
annotations if the Traefik CRDs happen to exist). Only checked on upgrade so
that helm template / lint keep working without a cluster.
*/ -}}
{{- if and .Release.IsUpgrade (not (.Capabilities.APIVersions.Has "traefik.io/v1alpha1")) -}}
{{- fail (printf "nomad.ingress targets Traefik (the default since chart 1.5.0) but the Traefik CRDs (traefik.io/v1alpha1) are not installed in this cluster. Still on ingress-nginx? Set nomad.ingress.controller=nginx. To migrate, install Traefik first; see charts/default/custom-values/README.md#migrating-from-ingress-nginx (resolved controller: %s)" (include "nomad.ingress.controller" .)) -}}
{{- end -}}
{{- $fullName := include "nomad.fullname" . -}}
{{- $ing := .Values.nomad.ingress -}}
{{- if $ing.limitConnections }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-inflight
  labels:
    {{- include "nomad.labels" . | nindent 4 }}
spec:
  inFlightReq:
    amount: {{ $ing.limitConnections }}
{{- end }}
{{- if $ing.limitConnectionsApi }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-inflight-api
  labels:
    {{- include "nomad.labels" . | nindent 4 }}
spec:
  inFlightReq:
    amount: {{ $ing.limitConnectionsApi }}
{{- end }}
{{- if $ing.limitRps }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-ratelimit
  labels:
    {{- include "nomad.labels" . | nindent 4 }}
spec:
  rateLimit:
    average: {{ $ing.limitRps }}
    burst: {{ mul $ing.limitRps 5 }}
{{- end }}
{{- if $ing.sslRedirect }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ $fullName }}-redirect-https
  labels:
    {{- include "nomad.labels" . | nindent 4 }}
spec:
  redirectScheme:
    scheme: https
    permanent: true
{{- end }}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: {{ $fullName }}-transport
  labels:
    {{- include "nomad.labels" . | nindent 4 }}
spec:
  forwardingTimeouts:
    dialTimeout: {{ .Values.nomad.proxy.connectionTimeout }}s
    responseHeaderTimeout: {{ .Values.nomad.proxy.timeout }}s
{{- end }}
