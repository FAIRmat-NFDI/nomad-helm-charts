{{- if .Values.nomad.enabled -}}
{{- $fullName := include "nomad.fullname" . -}}

{{- if or .Values.nomad.secrets.api.value .Values.nomad.secrets.api.autoGenerate }}
{{- if not .Values.nomad.secrets.api.existingSecret }}
{{- $secretName := printf "%s-api-secret" $fullName }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "nomad.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.nomad.secrets.api.value }}
  {{ .Values.nomad.secrets.api.key }}: {{ .Values.nomad.secrets.api.value | b64enc }}
  {{- else if and $existingSecret (index $existingSecret.data .Values.nomad.secrets.api.key) }}
  {{ .Values.nomad.secrets.api.key }}: {{ index $existingSecret.data .Values.nomad.secrets.api.key }}
  {{- else if .Values.nomad.secrets.api.autoGenerate }}
  {{ .Values.nomad.secrets.api.key }}: {{ randAlphaNum 64 | b64enc }}
  {{- else }}
  {{ .Values.nomad.secrets.api.key }}: {{ required "API secret must be provided via nomad.secrets.api.value or nomad.secrets.api.existingSecret when autoGenerate is disabled" "" | b64enc }}
  {{- end }}
---
{{- end }}
{{- end }}

{{- if .Values.nomad.secrets.keycloak.clientSecret.value }}
{{- if not .Values.nomad.secrets.keycloak.clientSecret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-keycloak-client-secret
  labels:
    {{- include "nomad.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.nomad.secrets.keycloak.clientSecret.key }}: {{ .Values.nomad.secrets.keycloak.clientSecret.value | b64enc }}
---
{{- end }}
{{- end }}

{{- if not .Values.nomad.config.oasis.uses_central_user_management }}
{{- if not (or .Values.nomad.secrets.keycloak.password.existingSecret .Values.nomad.secrets.keycloak.password.value) }}
{{- fail "Keycloak admin password must be provided via nomad.secrets.keycloak.password.value or nomad.secrets.keycloak.password.existingSecret when uses_central_user_management is false (local Keycloak)" }}
{{- end }}
{{- end }}
{{- if .Values.nomad.secrets.keycloak.password.value }}
{{- if not .Values.nomad.secrets.keycloak.password.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-keycloak-password-secret
  labels:
    {{- include "nomad.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.nomad.secrets.keycloak.password.key }}: {{ .Values.nomad.secrets.keycloak.password.value | b64enc }}
---
{{- end }}
{{- end }}

{{- if .Values.nomad.secrets.client.password.value }}
{{- if not .Values.nomad.secrets.client.password.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-client-password-secret
  labels:
    {{- include "nomad.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.nomad.secrets.client.password.key }}: {{ .Values.nomad.secrets.client.password.value | b64enc }}
---
{{- end }}
{{- end }}

{{- if .Values.nomad.secrets.datacite.value }}
{{- if not .Values.nomad.secrets.datacite.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullName }}-datacite-secret
  labels:
    {{- include "nomad.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.nomad.secrets.datacite.key }}: {{ .Values.nomad.secrets.datacite.value | b64enc }}
---
{{- end }}
{{- end }}

{{- $config := .Values.nomad.config -}}
{{- if $config.north.enabled }}
{{- $northSecret := .Values.nomad.secrets.north.hubServiceApiToken -}}
{{- $northSecretName := include "nomad.secretName.north" . -}}
{{- if .Values.jupyterhub.enabled }}
{{- $hubEnv := dig "hub" "extraEnv" (dict) .Values.jupyterhub -}}
{{- $hubToken := "" -}}
{{- if kindIs "map" $hubEnv }}
{{- $hubToken = get $hubEnv "NOMAD_NORTH_HUB_SERVICE_API_TOKEN" -}}
{{- else }}
{{- range $hubEnv }}
{{- if eq (toString (get . "name")) "NOMAD_NORTH_HUB_SERVICE_API_TOKEN" }}{{- $hubToken = . -}}{{- end }}
{{- end }}
{{- end }}
{{- if not $hubToken }}
{{- fail (printf "\njupyterhub.hub.extraEnv.NOMAD_NORTH_HUB_SERVICE_API_TOKEN is not set, so the hub registers no NOMAD service token. Point it at the secret NOMAD reads (%s, key %q)." $northSecretName $northSecret.key) }}
{{- end }}
{{- if kindIs "map" $hubToken }}
{{- $hubRef := dig "valueFrom" "secretKeyRef" (dict) $hubToken -}}
{{- if and $hubRef (or (ne (toString $hubRef.name) $northSecretName) (ne (toString $hubRef.key) $northSecret.key)) }}
{{- fail (printf "\nNOMAD and the NORTH hub read the hub service API token from different secrets:\n  NOMAD (nomad.secrets.north.hubServiceApiToken): %s, key %q\n  hub (jupyterhub.hub.extraEnv.NOMAD_NORTH_HUB_SERVICE_API_TOKEN): %s, key %q\nPoint both at the same secret, e.g. use the hub's:\n  --set nomad.secrets.north.hubServiceApiToken.existingSecret=%s --set nomad.secrets.north.hubServiceApiToken.key=%s\nor NOMAD's:\n  --set jupyterhub.hub.extraEnv.NOMAD_NORTH_HUB_SERVICE_API_TOKEN.valueFrom.secretKeyRef.name=%s --set jupyterhub.hub.extraEnv.NOMAD_NORTH_HUB_SERVICE_API_TOKEN.valueFrom.secretKeyRef.key=%s" $northSecretName $northSecret.key (toString $hubRef.name) (toString $hubRef.key) (toString $hubRef.name) (toString $hubRef.key) $northSecretName $northSecret.key) }}
{{- end }}
{{- end }}
{{- end }}

{{- if not $northSecret.existingSecret }}
{{- $northToken := $northSecret.value | default $config.north.hub_service_api_token -}}
{{- if not $northToken }}
{{- fail "JupyterHub service API token must be provided via nomad.secrets.north.hubServiceApiToken.existingSecret or .value (or nomad.config.north.hub_service_api_token) when north is enabled" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $northSecretName }}
  labels:
    {{- include "nomad.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $northSecret.key }}: {{ $northToken | b64enc }}
---
{{- end }}
{{- end }}

{{- end }}
