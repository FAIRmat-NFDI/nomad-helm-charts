{{- /*
Renders nothing; fails the install/upgrade on Elasticsearch settings left over from
chart 1.x (elastic/elasticsearch 7 subchart) that would otherwise be silently ignored.
*/ -}}
{{- $es := .Values.elasticsearch -}}
{{- $docs := "see 'Upgrading from chart 1.x: Elasticsearch 7 -> 9' in the chart README" -}}

{{- /* image/imageTag keep the old subchart's names, so an old ES7 tag override would still apply. */ -}}
{{- if and $es.enabled (not (hasPrefix "9." ($es.imageTag | toString))) }}
{{- fail (printf "elasticsearch.imageTag is %v, but the bundled Elasticsearch must be 9.x (NOMAD 2.x); an old ES7 imageTag override from chart 1.x has to be removed. %s" $es.imageTag $docs) }}
{{- end }}

{{- /* Keys of the old elastic/elasticsearch subchart that no longer have an effect. */ -}}
{{- $oldKeys := list -}}
{{- /* Harmless leftovers (minimumMasterNodes, clusterHealthCheckParams, replicas: 1) are ignored. */ -}}
{{- range $key := list "esConfig" "volumeClaimTemplate" }}
{{- if hasKey $es $key }}
{{- $oldKeys = append $oldKeys (printf "elasticsearch.%s" $key) }}
{{- end }}
{{- end }}
{{- if gt (int ($es.replicas | default 1)) 1 }}
{{- $oldKeys = append $oldKeys "elasticsearch.replicas > 1 (the bundled ES9 is single-node; point nomad.infrastructure.elastic.host at an external cluster for more)" }}
{{- end }}
{{- if $oldKeys }}
{{- fail (printf "%s belonged to the old elastic/elasticsearch 7 subchart and are no longer used (Elasticsearch is now a single-node ES9 StatefulSet: use elasticsearch.settings and elasticsearch.persistence instead); %s" (join ", " $oldKeys) $docs) }}
{{- end }}

