{{/*
The separate API ingress only exists to apply a tighter per-client connection
limit on the /api path (limitConnectionsApi): an nginx limit-connections
annotation, or a Traefik InFlightReq middleware. The longer path prefix wins
over the main ingress's api_base_path rule in both controllers.

It is skipped for L7 load balancers that turn each Ingress resource into its
own load balancer (alb, gce). there the main ingress's api_base_path Prefix
rule already covers the /api path.
*/}}
{{- $controller := include "nomad.ingress.controller" . -}}
{{- if and .Values.nomad.ingress.enabled .Values.nomad.ingress.limitConnectionsApi (ne $controller "alb") (ne $controller "gce") -}}
{{- $config := .Values.nomad.config -}}
{{- $fullName := include "nomad.fullname" . -}}
{{- $svcPort := .Values.nomad.service.port -}}
{{- $path := $config.services.api_base_path -}}
{{- $apiHost := $config.services.api_host -}}
{{- if and .Values.nomad.ingress.className (not (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion)) }}
  {{- if not (hasKey .Values.nomad.ingress.annotations "kubernetes.io/ingress.class") }}
  {{- $_ := set .Values.nomad.ingress.annotations "kubernetes.io/ingress.class" .Values.nomad.ingress.className}}
  {{- end }}
{{- end }}
{{- if semverCompare ">=1.19-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1
{{- else if semverCompare ">=1.14-0" .Capabilities.KubeVersion.GitVersion -}}
apiVersion: networking.k8s.io/v1beta1
{{- else -}}
apiVersion: extensions/v1beta1
{{- end }}
kind: Ingress
metadata:
  name: {{ $fullName }}-api
  labels:
    {{- include "nomad.labels" . | nindent 4 }}
  annotations:
    {{- include "nomad.ingress.annotations" (dict "root" . "limitConnections" .Values.nomad.ingress.limitConnectionsApi "middleware" "inflight-api") | nindent 4 }}
spec:
  {{- if and .Values.nomad.ingress.className (semverCompare ">=1.18-0" .Capabilities.KubeVersion.GitVersion) }}
  ingressClassName: {{ .Values.nomad.ingress.className }}
  {{- end }}
  {{- if or .Values.nomad.ingress.tls .Values.nomad.ingress.certManager.enabled }}
  tls:
    {{- if .Values.nomad.ingress.tls }}
    {{- range .Values.nomad.ingress.tls }}
    - hosts:
        {{- range .hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: {{ .secretName }}
    {{- end }}
    {{- else }}
    - hosts:
        - {{ $apiHost | quote }}
      secretName: {{ $fullName }}-tls
    {{- end }}
  {{- end }}
  rules:
    - host: {{ $apiHost | quote }}
      http:
        paths:
          - path: {{ trimSuffix "/" $path }}/api
            pathType: Prefix
            backend:
              {{- if semverCompare ">=1.19-0" $.Capabilities.KubeVersion.GitVersion }}
              service:
                name: {{ $fullName }}-proxy
                port:
                  number: {{ $svcPort }}
              {{- else }}
              serviceName: {{ $fullName }}-proxy
              servicePort: {{ $svcPort }}
              {{- end }}
{{- end }}
