{{- if .Values.nomad.enabled -}}
{{- $config := .Values.nomad.config -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nomad.fullname" . }}-gpuworker
  labels:
    {{- include "nomad.labels" . | nindent 4 }}
    app.kubernetes.io/component: gpuworker
spec:
  replicas: {{ .Values.nomad.gpuworker.replicaCount }}
  selector:
    matchLabels:
      {{- include "nomad.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gpuworker
  template:
    metadata:
      {{- with .Values.nomad.gpuworker.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
        {{- if $.Values.roll }}
        rollme: {{ randAlphaNum 5 | quote }}
        {{- end }}
      {{- else }}
      {{- if .Values.roll }}
      annotations:
        rollme: {{ randAlphaNum 5 | quote }}
      {{- end }}
      {{- end }}
      labels:
        {{- include "nomad.labels" . | nindent 8 }}
        {{- with .Values.nomad.gpuworker.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/component: gpuworker
    spec:
      {{- with .Values.nomad.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "nomad.serviceAccountName" . }}
      enableServiceLinks: false
      {{- with .Values.nomad.gpuworker.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}-gpuworker
          {{- with .Values.nomad.gpuworker.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.nomad.gpuworker.image.repository }}
          image: "{{ .Values.nomad.gpuworker.image.repository }}:{{ .Values.nomad.gpuworker.image.tag | default .Chart.AppVersion }}"
          {{- else }}
          image: "{{ .Values.nomad.image.repository }}:{{ .Values.nomad.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.nomad.image.pullPolicy }}
          {{- if .Values.nomad.config.temporal.prometheus_bind_address }}
          {{- $address := toString .Values.nomad.config.temporal.prometheus_bind_address }}
          {{- $port := "9000" }}
          {{- if contains ":" $address }}
            {{- $parts := splitList ":" $address }}
            {{- $port = last $parts | default "9000" }}
          {{- else if not (contains "." $address) }}
            {{- if and (ne $address "localhost") (ne $address "") }}
              {{- $port = $address }}
            {{- end }}
          {{- end }}
          ports:
            - name: metrics
              containerPort: {{ $port }}
              protocol: TCP
          {{- end }}
          workingDir: {{ $config.fs.working_directory | default "/app" }}
          {{- with .Values.nomad.gpuworker.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - mountPath: /app/nomad.yaml
              name: nomad-conf
              subPath: nomad.yaml
            - mountPath: /app/.volumes/fs/public
              name: public-volume
            - mountPath: /app/.volumes/fs/staging
              name: staging-volume
            - mountPath: /app/.volumes/fs/actions
              name: actions-volume
            {{- with .Values.nomad.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- with .Values.nomad.gpuworker.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: MPLCONFIGDIR
              value: /tmp/matplotlib
            - name: NOMAD_CONFIG
              value: /app/nomad.yaml
            - name: NOMAD_META_SERVICE
              value: "worker"
            - name: NOMAD_CONSOLE_LOG_LEVEL
              value: "{{ $config.logging.worker.console_loglevel }}"
            - name: NOMAD_LOGSTASH_LEVEL
              value: "{{ $config.logging.worker.logstash_loglevel }}"

            {{- if .Values.nomad.secrets.api.secretName }}
            - name: NOMAD_SERVICES_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nomad.secrets.api.secretName }}
                  key: password
            {{- end }}
            {{- if .Values.nomad.secrets.keycloak.clientSecretName }}
            - name: NOMAD_KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nomad.secrets.keycloak.clientSecretName }}
                  key: password
            {{- end }}
            {{- if .Values.nomad.secrets.keycloak.passwordSecretName }}
            - name: NOMAD_KEYCLOAK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.nomad.secrets.keycloak.passwordSecretName }}
                  key: password
            {{- end }}
          # Liveness and readiness probes check the Python Temporal worker's HTTP health server.
          command: ["python", "-m", "nomad.cli", "admin", "run", "action-gpu-worker"]
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: {{ .Values.nomad.gpuworker.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.nomad.gpuworker.livenessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.nomad.gpuworker.livenessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.nomad.gpuworker.livenessProbe.failureThreshold }}
            successThreshold: {{ .Values.nomad.gpuworker.livenessProbe.successThreshold | default 1 }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: {{ .Values.nomad.gpuworker.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.nomad.gpuworker.readinessProbe.periodSeconds }}
            timeoutSeconds: {{ .Values.nomad.gpuworker.readinessProbe.timeoutSeconds }}
            failureThreshold: {{ .Values.nomad.gpuworker.readinessProbe.failureThreshold }}
            successThreshold: {{ .Values.nomad.gpuworker.readinessProbe.successThreshold | default 1 }}
      volumes:
      {{- with .Values.nomad.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nomad.gpuworker.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
        - name: nomad-conf
          configMap:
            name: {{ include "nomad.fullname" . }}-configmap
        {{- include "nomad.dataVolume" (dict "root" . "name" "public-volume" "volumeKey" "public" "hostPath" $config.fs.public_external) | nindent 8 }}
        {{- if (eq .Values.nomad.worker.storage "memory") }}
        - name: staging-volume
          emptyDir:
            medium: 'Memory'
        {{- else }}
        {{- include "nomad.dataVolume" (dict "root" . "name" "staging-volume" "volumeKey" "staging" "hostPath" $config.fs.staging_external) | nindent 8 }}
        {{- end }}
        {{- include "nomad.dataVolume" (dict "root" . "name" "actions-volume" "volumeKey" "actions" "hostPath" $config.fs.actions_external) | nindent 8 }}

      {{- with .Values.nomad.gpuworker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nomad.gpuworker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nomad.gpuworker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
