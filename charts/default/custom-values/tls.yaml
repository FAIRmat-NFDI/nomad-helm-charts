# TLS overlay for self-hosted ingress controllers (Traefik, ingress-nginx) with cert-manager
# visit https://cert-manager.io/docs/configuration/acme/
nomad:
  config:
    services:
      # Must be set to true when TLS is active so NOMAD generates https:// URLs
      https: true

  ingress:
    sslRedirect: true

    # cert-manager will provision and auto-renew the certificate.
    # The TLS secret is named <release-name>-tls and created automatically.
    certManager:
      enabled: true
      issuerName: letsencrypt-prod
      issuerKind: ClusterIssuer

jupyterhub:
  hub:
    config:
      GenericOAuthenticator:
        # Update the OAuth callback URL to use https when TLS is active
        oauth_callback_url: https://your-domain.com/nomad-oasis/north/hub/oauth_callback
    extraEnv:
      NOMAD_OASIS_URL: "https://your-domain.com/nomad-oasis"
  ingress:
    annotations:
      # Reuse the https redirect Middleware rendered by the NOMAD chart
      # (<namespace>-<release>-redirect-https); adjust if you deploy to another
      # namespace or release name. For ingress-nginx use
      #   nginx.ingress.kubernetes.io/ssl-redirect: "true"
      traefik.ingress.kubernetes.io/router.middlewares: nomad-oasis-nomad-oasis-redirect-https@kubernetescrd
    tls:
      - hosts:
          - your-domain.com
        secretName: nomad-oasis-jupyterhub-tls
